[project]
name = "shared-memory"
version = "0.1.0"
description = "Shared memory for a team's Claude Code sessions"
authors = [
    { name = "madhav037", email = "madhavlehru@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "pgvector>=0.5.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pygit2>=1.20.1",
    "pyyaml>=6.0.3",
    "starlette>=1.6.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
shared-memory = "shared_memory.cli:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: a run that skipped something says so, which -q alone hides. Four tests skip when node, sh or pwsh
# is missing, and a skipped CI run should not read as a passing one.
addopts = "-q -ra"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["src", "tests", "smoke"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "pgvector.*"]
ignore_missing_imports = true

[tool.ruff]
# The length the code is written to. E501 stays off until the lines already past it are wrapped.
line-length = 120

[tool.ruff.lint]
# Syntax errors, pyflakes and pycodestyle, bugbear's common bug patterns, and bandit's security rules. Nothing here
# reformats. A security rule silenced on one line says why on that line.
select = ["E", "W", "F", "B", "S"]
ignore = [
    "E501",
    # Asserts here narrow types for mypy (`row is not None`) and guard no permission, so `python -O` stripping them
    # would turn a None into a crash, never into a way past a check.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# Tests and the smoke and stress runs assert, start git and the CLI as subprocesses, and use made-up tokens.
"tests/**" = ["S"]
"smoke/**" = ["S"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
