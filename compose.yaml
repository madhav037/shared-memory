services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shared_memory
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SHARED_MEMORY_DATABASE_URL: postgresql://postgres:postgres@db:5432/shared_memory
      SHARED_MEMORY_ROOT: /data/memory
      SHARED_MEMORY_MODEL_CACHE: /data/models
    ports:
      - "8000:8000"
    volumes:
      - memory-data:/data

volumes:
  db-data:
  memory-data:
