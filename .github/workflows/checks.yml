name: Checks

# Everything that must hold for every change: the server's lint, tests and types, and the console's types, build and journeys.
# The smoke tests with real Claude Code are separate and run nightly.
#
# The server and the console are checked side by side, and a pull request runs only the side its files can affect: a
# change inside console/ alone can't break the server, while the console's journeys run against the real server, so
# they run for server changes too. Every push to main runs both. The job named checks says whether everything that ran
# passed; it is the one check a pull request needs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ github.event_name == 'push' || steps.filter.outputs.server == 'true' }}
      console: ${{ github.event_name == 'push' || steps.filter.outputs.console == 'true' }}
      edge: ${{ github.event_name == 'push' || steps.filter.outputs.edge == 'true' }}
      images: ${{ github.event_name == 'push' || steps.filter.outputs.images == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Which side the change can affect
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            server:
              - "**"
              - "!console/**"
            console:
              - "**"
              - "!docs/**"
              - "!deploy/**"
              - "!smoke/**"
              - "!plugin/**"
              - "!*.md"
            edge:
              - "{deploy,console}/**"
            images:
              - "{Dockerfile,.dockerignore,pyproject.toml,uv.lock,deploy/**,.github/workflows/checks.yml,.github/workflows/deploy.yml}"

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shared_memory
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Cache the search model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('uv.lock') }}

      - name: Server lint
        run: uv run ruff check

      # Every locked server dependency ships in the image, so all of them are audited.
      - name: Server dependencies have no known vulnerabilities
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --quiet -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip -r "$RUNNER_TEMP/requirements.txt"

      # tests/test_backup.py runs the real backup script, whose encrypted form needs age (the backup image has it).
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age

      - name: Server tests
        run: uv run pytest

      - name: Server types
        run: uv run mypy

  console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shared_memory
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Cache the search model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('uv.lock') }}

      # Some server tests read the console's files (its API contract, its words, its journey harness); a change
      # inside console/ alone skips the server job, so those tests run here, found by what they read.
      - name: Server tests that read the console
        run: uv run pytest $(grep -lE 'ROOT / "console"' tests/test_*.py)

      - name: Install the console's dependencies
        working-directory: console
        run: npm ci

      # Only what reaches a browser gates a merge; build tools' advisories arrive as Dependabot updates instead.
      - name: The console's shipped dependencies have no high-severity vulnerabilities
        working-directory: console
        run: npm audit --omit=dev --audit-level=high

      - name: Console types and build
        working-directory: console
        run: npm run build

      - name: Console lint
        working-directory: console
        run: npm run lint

      - name: Console units
        working-directory: console
        run: npm run test

      - name: The console's API types are current
        working-directory: console
        run: npm run api:check

      - name: Cache the browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('console/package-lock.json') }}

      - name: Install the browser
        if: steps.browser.outputs.cache-hit != 'true'
        working-directory: console
        run: npx playwright install --with-deps chromium

      - name: Install the browser's system libraries
        if: steps.browser.outputs.cache-hit == 'true'
        working-directory: console
        run: npx playwright install-deps chromium

      - name: Browser journeys
        working-directory: console
        run: npm run e2e

      - name: Keep the failed journeys' traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: console/playwright-report
          retention-days: 7

  # The live site is built from deploy/console/Dockerfile and served by deploy/Caddyfile. A Caddyfile Caddy refuses, or a
  # module that no longer builds, would take it down on the next deploy, so the image is built here and Caddy is run
  # against the file with the environment the example gives it.
  edge:
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the console image
        run: docker build -f deploy/console/Dockerfile -t console-edge .

      - name: Caddy has the rate-limit module
        run: docker run --rm console-edge caddy list-modules | grep -x 'http.handlers.rate_limit'

      - name: Caddy accepts the Caddyfile
        run: |
          set -a
          . deploy/.env.example
          set +a
          docker run --rm             -e CADDY_SITE_ADDRESS="${SHARED_MEMORY_DOMAIN:-memory.example.com}"             -e CADDY_ROBOTS_TAG="${SHARED_MEMORY_ROBOTS_TAG:-noindex}"             console-edge caddy validate --config /etc/caddy/Caddyfile

  # A deploy sends the server only the layers it lacks (deploy/upload.py). This builds the release twice, the second time
  # with only the server's code changed, and hands both to real Docker the way a deploy hands them to the server: the
  # first whole, then the second less what the daemon reports it holds (deploy.sh layers). The second must be small,
  # load, and run once the first is gone. The daemons are the server's Docker, 29.9 rootless with the containerd image
  # store, and the classic store; a third holds the first release as compressed layers, as a server loaded before this.
  transfer:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Name the server's base image
        run: echo "BASE=$(python3 deploy/server_base.py tag)" >> "$GITHUB_ENV"

      - name: Build a release, as a deploy builds it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=docker,compression=uncompressed,force-compression=true
          tags: shared-memory-server:one
          cache-from: |
            type=gha,scope=server-base-${{ env.BASE }}
            type=gha,scope=server
          cache-to: type=gha,scope=server-base-${{ env.BASE }},mode=max

      - name: Save the same release with compressed layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=docker,compression=gzip,force-compression=true,dest=${{ runner.temp }}/one-gzip.tar
          tags: shared-memory-server:one
          cache-from: type=gha,scope=server-base-${{ env.BASE }}

      - name: Change only the server's code
        run: echo "# Changed between the two builds." >> src/shared_memory/__init__.py

      - name: Build the next release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=docker,compression=uncompressed,force-compression=true
          tags: shared-memory-server:two
          cache-from: type=gha,scope=server-base-${{ env.BASE }}

      - name: Only the release layers differ
        shell: bash
        run: |
          read -ra one <<< "$(docker image inspect -f '{{join .RootFS.Layers " "}}' shared-memory-server:one)"
          read -ra two <<< "$(docker image inspect -f '{{join .RootFS.Layers " "}}' shared-memory-server:two)"
          common=0
          while [ "$common" -lt "${#two[@]}" ] && [ "${one[$common]}" = "${two[$common]}" ]; do common=$((common + 1)); done
          echo "The two releases share their bottom $common of ${#two[@]} layers."
          [ $(( ${#two[@]} - common )) -le 3 ] || { echo "::error::More than the release layers changed."; exit 1; }

      - name: Start Docker daemons like the server's
        run: |
          docker version -f 'The runner: Docker {{.Server.Version}}'
          docker info -f 'The runner stores images with {{.Driver}}'
          # Rootless Docker inside a container makes its own user namespace, which Ubuntu 24.04 restricts by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo '{"features": {"containerd-snapshotter": false}}' > "$RUNNER_TEMP/classic.json"
          docker run -d --privileged --name server-like -p 127.0.0.1:2375:2375 -e DOCKER_TLS_CERTDIR= docker:29.9.1-dind-rootless
          docker run -d --privileged --name classic -p 127.0.0.1:2376:2375 -e DOCKER_TLS_CERTDIR= \
            -v "$RUNNER_TEMP/classic.json:/etc/docker/daemon.json:ro" docker:29.9.1-dind
          docker run -d --privileged --name loaded-compressed -p 127.0.0.1:2377:2375 -e DOCKER_TLS_CERTDIR= docker:29.9.1-dind-rootless
          for port in 2375 2376 2377; do
            for _ in $(seq 90); do DOCKER_HOST=tcp://127.0.0.1:$port docker info > /dev/null 2>&1 && break; sleep 1; done
            DOCKER_HOST=tcp://127.0.0.1:$port docker info -f "$port: Docker {{.ServerVersion}}, storage {{.Driver}}, {{.SecurityOptions}}" \
              || { docker logs "$(docker ps -q --filter publish=$port)"; exit 1; }
          done

      - name: The next release goes over in megabytes, loads on top of the first, and runs without it
        shell: bash
        run: |
          docker save -o "$RUNNER_TEMP/one.tar" shared-memory-server:one
          docker save -o "$RUNNER_TEMP/two.tar" shared-memory-server:two
          whole=$(gzip -1 < "$RUNNER_TEMP/two.tar" | wc -c)
          for port in 2375 2376 2377; do
            export DOCKER_HOST=tcp://127.0.0.1:$port
            first="$RUNNER_TEMP/one.tar"
            [ "$port" != 2377 ] || first="$RUNNER_TEMP/one-gzip.tar"
            docker load -q -i "$first"
            SSH_ORIGINAL_COMMAND=layers bash deploy/deploy.sh > "$RUNNER_TEMP/held"
            cat "$RUNNER_TEMP/held"
            python3 deploy/upload.py "$RUNNER_TEMP/held" "$RUNNER_TEMP/two.tar" | gzip -1 > "$RUNNER_TEMP/upload.tar.gz"
            sent=$(stat -c %s "$RUNNER_TEMP/upload.tar.gz")
            echo "::notice::$port ($(docker info -f '{{.Driver}}')): a code-only release sends $sent bytes gzipped, of $whole for the whole image."
            [ "$sent" -lt 50000000 ] || { echo "::error::$sent bytes is no small transfer."; exit 1; }
            # As deploy.sh loads it, then removes the release before, so only what the second release brought is left.
            gunzip < "$RUNNER_TEMP/upload.tar.gz" | docker load -q
            docker image rm shared-memory-server:one
            docker image prune -f
            docker image ls
            docker run --rm --network none shared-memory-server:two sh -ec '
              grep -q "Changed between the two builds" src/shared_memory/__init__.py
              shared-memory --help > /dev/null
              python -c "
          from pathlib import Path
          from shared_memory.embeddings import DIMENSIONS, FastEmbedEmbedder
          assert len(FastEmbedEmbedder(Path(\"/opt/models\")).query(\"where are the deploy notes\")) == DIMENSIONS
          print(\"The release runs, and finds its search model with no network.\")"'
            docker system df
            unset DOCKER_HOST
          done

  checks:
    needs: [changes, server, console, edge, transfer]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Everything that ran passed
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.server.result }} ${{ needs.console.result }} ${{ needs.edge.result }} ${{ needs.transfer.result }}
        run: |
          echo "changes, server, console, edge, transfer: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A check ended $result."; exit 1 ;;
            esac
          done
          [ "${{ needs.changes.result }}" = success ] || { echo "::error::Couldn't tell what the change affects."; exit 1; }
